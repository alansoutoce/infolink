<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento de Produção - Equipe Técnica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  /* LOGIN */
  #loginBox {
    max-width: 420px;
    margin: 80px auto;
    background: #fff;
    border-radius: 16px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  #loginBox h1 { color: #1e3c72; font-size: 22px; margin-bottom: 8px; }
  #loginBox p { color: #777; font-size: 14px; margin-bottom: 25px; }
  #loginBox input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    text-align: center;
    letter-spacing: 1px;
    transition: border .2s;
  }
  #loginBox input:focus { outline: none; border-color: #2a5298; }
  #loginBox button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s;
  }
  #loginBox button:hover { transform: translateY(-2px); }
  #loginMsg { margin-top: 15px; font-size: 14px; color: #d32f2f; min-height: 20px; }

  /* HEADER */
  #appArea { display: none; }
  header {
    background: #fff;
    border-radius: 14px;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }
  header .user-info h2 { color: #1e3c72; font-size: 18px; }
  header .user-info span { color: #666; font-size: 13px; }
  header button {
    padding: 10px 20px;
    background: #d32f2f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  /* CALENDÁRIO */
  .calendar-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .cal-header h3 { color: #1e3c72; font-size: 20px; text-transform: capitalize; }
  .cal-nav button {
    background: #2a5298;
    color: #fff;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    margin-left: 6px;
  }
  .cal-nav button:hover { background: #1e3c72; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-grid .dow {
    text-align: center;
    font-weight: bold;
    color: #777;
    font-size: 12px;
    padding: 8px 0;
    text-transform: uppercase;
  }
  .day {
    aspect-ratio: 1/1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .15s;
    position: relative;
    background: #f5f7fb;
  }
  .day:hover { background: #e3eaf7; border-color: #2a5298; }
  .day.empty { background: transparent; cursor: default; }
  .day.empty:hover { border-color: transparent; }
  .day .num { font-weight: 600; }
  .day .count {
    font-size: 10px;
    background: #2a5298;
    color: #fff;
    border-radius: 10px;
    padding: 1px 7px;
    margin-top: 3px;
    font-weight: bold;
  }
  .day.has-prod { background: #e8f5e9; border-color: #4caf50; }
  .day.has-prod:hover { background: #c8e6c9; }
  .day.today { box-shadow: inset 0 0 0 2px #ff9800; }

  /* MODAL */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    padding: 20px;
    overflow-y: auto;
  }
  #modal .modal-content {
    background: #fff;
    max-width: 1100px;
    margin: 40px auto;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #modal .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 2px solid #eee;
    padding-bottom: 12px;
  }
  #modal .modal-header h3 { color: #1e3c72; }
  #modal .close-btn {
    background: #d32f2f;
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #1e3c72;
    color: #fff;
    padding: 10px 8px;
    text-align: left;
    white-space: nowrap;
  }
  td { padding: 9px 8px; border-bottom: 1px solid #eee; }
  tr:nth-child(even) td { background: #f7f9fc; }
  tr:hover td { background: #eef3fb; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    background: #e3eaf7;
    color: #1e3c72;
  }
  .empty-msg { text-align: center; color: #999; padding: 30px; }

  #loading {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    font-size: 18px;
    color: #1e3c72;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 5px solid #ddd;
    border-top-color: #2a5298;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 15px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .day { font-size: 13px; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Carregando planilhas...</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <h1>🔧 Acompanhamento de Produção</h1>
    <p>Digite seu CPF para acessar</p>
    <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
    <button onclick="fazerLogin()">Entrar</button>
    <div id="loginMsg"></div>
  </div>

  <!-- APP -->
  <div id="appArea">
    <header>
      <div class="user-info">
        <h2 id="userName">—</h2>
        <span id="userInfo">—</span>
      </div>
      <button onclick="sair()">Sair</button>
    </header>

    <div class="calendar-card">
      <div class="cal-header">
        <h3 id="monthLabel">—</h3>
        <div class="cal-nav">
          <button onclick="mudarMes(-1)">‹</button>
          <button onclick="mudarMes(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Produção do dia</h3>
      <button class="close-btn" onclick="fecharModal()">×</button>
    </div>
    <div class="table-wrap" id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   DADOS GLOBAIS
   ============================================================ */
let CPF_DATA = [];          // { nome, cpf, empresa, matricula }
let PRODUCAO = [];          // registros de encerradasgestao
let USUARIO = null;         // colaborador logado
let MES_ATUAL = new Date(); // mês exibido no calendário

/* Normaliza CPF: só dígitos */
function soDigitos(v) {
  return String(v || '').replace(/\D/g, '');
}

/* Formata CPF para exibição */
function formatCPF(v) {
  const d = soDigitos(v);
  if (d.length !== 11) return v;
  return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

/* ============================================================
   CARREGAMENTO DAS PLANILHAS
   ============================================================ */
async function carregarPlanilhas() {
  try {
    /* ---------- GESTAO.xlsx (CPF) ---------- */
    const respGestao = await fetch('GESTAO.xlsx');
    if (!respGestao.ok) throw new Error('GESTAO.xlsx não encontrada na pasta.');
    const bufGestao = await respGestao.arrayBuffer();
    const wbGestao = XLSX.read(bufGestao, { type: 'array' });

    // Aba CPF (índice 4)
    const wsCPF = wbGestao.Sheets['CPF'] || wbGestao.Sheets[wbGestao.SheetNames[4]];
    const rowsCPF = XLSX.utils.sheet_to_json(wsCPF, { header: 1, defval: '' });
    CPF_DATA = [];
    // Linha 0 vazia, linha 1 cabeçalho (Nome, Matrícula, Empresa, Cpf)
    for (let i = 2; i < rowsCPF.length; i++) {
      const r = rowsCPF[i];
      const nome = String(r[0] || '').trim();
      const cpf  = soDigitos(r[3]);
      if (nome && cpf.length === 11) {
        CPF_DATA.push({
          nome,
          matricula: String(r[1] || '').trim(),
          empresa:   String(r[2] || '').trim(),
          cpf
        });
      }
    }
    console.log('CPFs carregados:', CPF_DATA.length);

    /* ---------- encerradasgestao.xlsx (PRODUÇÃO) ---------- */
    const respProd = await fetch('encerradasgestao.xlsx');
    if (!respProd.ok) throw new Error('encerradasgestao.xlsx não encontrada na pasta.');
    const bufProd = await respProd.arrayBuffer();
    const wbProd = XLSX.read(bufProd, { type: 'array' });
    const wsProd = wbProd.Sheets[wbProd.SheetNames[0]];
    const rowsProd = XLSX.utils.sheet_to_json(wsProd, { header: 1, defval: '' });

    // Cabeçalho na linha 0 — mapear índices das colunas
    const header = rowsProd[0].map(h => String(h || '').trim().toUpperCase());
    const idx = {
      A: header.findIndex(h => h === 'A' || h.includes('PROTOCOLO')),
      B: header.findIndex(h => h === 'B' || h.includes('CLIENTE') || h.includes('NOME')),
      D: header.findIndex(h => h === 'D' || h.includes('TIPO') || h.includes('ATIVIDADE')),
      H: header.findIndex(h => h === 'H' || h.includes('CIDADE')),
      I: header.findIndex(h => h === 'I' || h.includes('BAIRRO')),
      Q: header.findIndex(h => h === 'Q' || h.includes('ENCERRAMENTO') || h.includes('DATA')),
      V: header.findIndex(h => h === 'V' || h.includes('CAT_4') || h.includes('RECLAMA')),
      X: header.findIndex(h => h === 'X' || h.includes('SOLU'))
    };
    console.log('Índices mapeados:', idx);

    PRODUCAO = [];
    for (let i = 1; i < rowsProd.length; i++) {
      const r = rowsProd[i];
      if (!r || r.length === 0) continue;

      // Data de encerramento (coluna Q) — pode vir como serial Excel ou string
      const rawData = r[idx.Q];
      const data = parseDataExcel(rawData);
      if (!data) continue;

      PRODUCAO.push({
        protocolo:  String(r[idx.A] ?? '').trim(),
        cliente:    String(r[idx.B] ?? '').trim(),
        tipo:       String(r[idx.D] ?? '').trim(),
        cidade:     String(r[idx.H] ?? '').trim(),
        bairro:     String(r[idx.I] ?? '').trim(),
        dataEncerr: data, // Date normalizada (sem hora)
        reclamacao: String(r[idx.V] ?? '').trim(),
        solucao:    String(r[idx.X] ?? '').trim()
      });
    }
    console.log('Produções carregadas:', PRODUCAO.length);

    document.getElementById('loading').style.display = 'none';

  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#d32f2f;text-align:center;padding:20px;font-size:16px;">
        ❌ Erro ao carregar planilhas<br><br>
        <small>${err.message}</small><br><br>
        <small>Certifique-se de que <b>GESTAO.xlsx</b> e <b>encerradasgestao.xlsx</b> estão na mesma pasta deste HTML.</small>
      </div>`;
    console.error(err);
  }
}

/* Converte serial Excel ou string em Date (somente data) */
function parseDataExcel(v) {
  if (v === null || v === undefined || v === '') return null;
  // Serial Excel
  if (typeof v === 'number' && v > 20000 && v < 60000) {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  // String
  const s = String(v).trim();
  // dd/mm/yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let ano = parseInt(m[3]);
    if (ano < 100) ano += 2000;
    return new Date(ano, parseInt(m[2]) - 1, parseInt(m[1]));
  }
  // yyyy-mm-dd
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  // Tenta Date
  const d = new Date(s);
  if (!isNaN(d)) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return null;
}

/* ============================================================
   LOGIN
   ============================================================ */
function fazerLogin() {
  const input = document.getElementById('cpfInput');
  const msg = document.getElementById('loginMsg');
  const cpf = soDigitos(input.value);

  if (cpf.length !== 11) {
    msg.textContent = 'Digite um CPF válido com 11 dígitos.';
    return;
  }

  const encontrado = CPF_DATA.find(c => c.cpf === cpf);
  if (!encontrado) {
    msg.textContent = 'CPF não encontrado na base de colaboradores.';
    return;
  }

  USUARIO = encontrado;
  msg.textContent = '';

  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('appArea').style.display = 'block';
  document.getElementById('userName').textContent = encontrado.nome;
  document.getElementById('userInfo').textContent =
    `${encontrado.empresa || '—'} ${encontrado.matricula ? '• Matrícula ' + encontrado.matricula : ''}`;

  MES_ATUAL = new Date();
  // Se o mês atual não tem produção, vai para o mês com produção mais recente
  const producoesUsuario = producoesDoUsuario();
  if (producoesUsuario.length > 0) {
    const ultima = producoesUsuario.reduce((a, b) => a.dataEncerr > b.dataEncerr ? a : b);
    MES_ATUAL = new Date(ultima.dataEncerr.getFullYear(), ultima.dataEncerr.getMonth(), 1);
  }
  renderizarCalendario();
}

function sair() {
  USUARIO = null;
  document.getElementById('appArea').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('cpfInput').value = '';
  document.getElementById('loginMsg').textContent = '';
  fecharModal();
}

/* ============================================================
   PRODUÇÃO DO USUÁRIO
   ============================================================ */
function producoesDoUsuario() {
  if (!USUARIO) return [];
  // Compara pelo nome (a produção não traz CPF diretamente)
  const nomeUsuario = normalizarNome(USUARIO.nome);
  return PRODUCAO.filter(p => normalizarNome(p.cliente) === nomeUsuario);
}

/* Normalização de nome para comparação (remove acentos, espaços extras) */
function normalizarNome(n) {
  return String(n || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
}

/* Agrupa produção por dia (yyyy-mm-dd) */
function producaoPorDia() {
  const mapa = {};
  producoesDoUsuario().forEach(p => {
    const key = dateKey(p.dataEncerr);
    if (!mapa[key]) mapa[key] = [];
    mapa[key].push(p);
  });
  return mapa;
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dia}`;
}

/* ============================================================
   CALENDÁRIO
   ============================================================ */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function mudarMes(delta) {
  MES_ATUAL = new Date(MES_ATUAL.getFullYear(), MES_ATUAL.getMonth() + delta, 1);
  renderizarCalendario();
}

function renderizarCalendario() {
  const grid = document.getElementById('calGrid');
  const label = document.getElementById('monthLabel');
  const ano = MES_ATUAL.getFullYear();
  const mes = MES_ATUAL.getMonth();

  label.textContent = `${MESES[mes]} ${ano}`;

  const primeiroDia = new Date(ano, mes, 1);
  const ultimoDia   = new Date(ano, mes + 1, 0);
  const diasNoMes   = ultimoDia.getDate();
  const diaSemanaInicio = primeiroDia.getDay(); // 0=Dom

  const porDia = producaoPorDia();
  const hojeKey = dateKey(new Date());

  let html = '';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => {
    html += `<div class="dow">${d}</div>`;
  });

  // espaços vazios antes do dia 1
  for (let i = 0; i < diaSemanaInicio; i++) {
    html += `<div class="day empty"></div>`;
  }

  for (let dia = 1; dia <= diasNoMes; dia++) {
    const key = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const qtd = porDia[key] ? porDia[key].length : 0;
    const classes = ['day'];
    if (qtd > 0) classes.push('has-prod');
    if (key === hojeKey) classes.push('today');
    html += `<div class="${classes.join(' ')}" onclick="abrirDia('${key}')">
        <span class="num">${dia}</span>
        ${qtd > 0 ? `<span class="count">${qtd}</span>` : ''}
      </div>`;
  }

  grid.innerHTML = html;
}

/* ============================================================
   MODAL
   ============================================================ */
function abrirDia(key) {
  if (!key) return;
  const porDia = producaoPorDia();
  const lista = porDia[key] || [];

  const [y, m, d] = key.split('-').map(Number);
  document.getElementById('modalTitle').textContent =
    `Produção de ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y} (${lista.length} registro${lista.length!==1?'s':''})`;

  const body = document.getElementById('modalBody');
  if (lista.length === 0) {
    body.innerHTML = `<div class="empty-msg">Nenhuma produção registrada neste dia.</div>`;
  } else {
    let html = `<table>
      <thead><tr>
        <th>Protocolo</th>
        <th>Cliente</th>
        <th>Tipo de Atividade</th>
        <th>Cidade</th>
        <th>Bairro</th>
        <th>Reclamação</th>
        <th>Solução</th>
      </tr></thead><tbody>`;
    lista.forEach(p => {
      html += `<tr>
        <td><span class="badge">${p.protocolo || '—'}</span></td>
        <td>${p.cliente || '—'}</td>
        <td>${p.tipo || '—'}</td>
        <td>${p.cidade || '—'}</td>
        <td>${p.bairro || '—'}</td>
        <td>${p.reclamacao || '—'}</td>
        <td>${p.solucao || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    body.innerHTML = html;
  }

  document.getElementById('modal').style.display = 'block';
}

function fecharModal() {
  document.getElementById('modal').style.display = 'none';
}

/* Fecha modal com ESC / clique no fundo */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') fecharModal();
});

/* Máscara de CPF no input */
document.getElementById('cpfInput').addEventListener('input', e => {
  let v = soDigitos(e.target.value).slice(0, 11);
  if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2}).*/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3}).*/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3}).*/, '$1.$2');
  e.target.value = v;
});
document.getElementById('cpfInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('DOMContentLoaded', carregarPlanilhas);
</script>
</body>
</html>
