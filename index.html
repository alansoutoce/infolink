<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento de Produção - Equipe Técnica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  /* LOGIN */
  #loginBox {
    max-width: 420px;
    margin: 80px auto;
    background: #fff;
    border-radius: 16px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  #loginBox h1 { color: #1e3c72; font-size: 22px; margin-bottom: 8px; }
  #loginBox p { color: #777; font-size: 14px; margin-bottom: 25px; }
  #loginBox input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    text-align: center;
    letter-spacing: 1px;
    transition: border .2s;
  }
  #loginBox input:focus { outline: none; border-color: #2a5298; }
  #loginBox button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s;
  }
  #loginBox button:hover { transform: translateY(-2px); }
  #loginMsg { margin-top: 15px; font-size: 14px; color: #d32f2f; min-height: 20px; }

  /* HEADER */
  #appArea { display: none; }
  header {
    background: #fff;
    border-radius: 14px;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }
  header .user-info h2 { color: #1e3c72; font-size: 18px; }
  header .user-info span { color: #666; font-size: 13px; }
  header button {
    padding: 10px 20px;
    background: #d32f2f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    border-left: 5px solid #2a5298;
  }
  .stat-card .label { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .value { font-size: 26px; font-weight: bold; color: #1e3c72; margin-top: 4px; }

  /* CALENDÁRIO */
  .calendar-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .cal-header h3 { color: #1e3c72; font-size: 20px; text-transform: capitalize; }
  .cal-nav button {
    background: #2a5298;
    color: #fff;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    margin-left: 6px;
  }
  .cal-nav button:hover { background: #1e3c72; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-grid .dow {
    text-align: center;
    font-weight: bold;
    color: #777;
    font-size: 12px;
    padding: 8px 0;
    text-transform: uppercase;
  }
  .day {
    aspect-ratio: 1/1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .15s;
    position: relative;
    background: #f5f7fb;
  }
  .day:hover { background: #e3eaf7; border-color: #2a5298; }
  .day.empty { background: transparent; cursor: default; }
  .day.empty:hover { border-color: transparent; }
  .day .num { font-weight: 600; }
  .day .count {
    font-size: 10px;
    background: #2a5298;
    color: #fff;
    border-radius: 10px;
    padding: 1px 7px;
    margin-top: 3px;
    font-weight: bold;
  }
  .day.has-prod { background: #e8f5e9; border-color: #4caf50; }
  .day.has-prod:hover { background: #c8e6c9; }
  .day.today { box-shadow: inset 0 0 0 2px #ff9800; }

  /* MODAL */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    padding: 20px;
    overflow-y: auto;
  }
  #modal .modal-content {
    background: #fff;
    max-width: 1100px;
    margin: 40px auto;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #modal .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 2px solid #eee;
    padding-bottom: 12px;
  }
  #modal .modal-header h3 { color: #1e3c72; }
  #modal .close-btn {
    background: #d32f2f;
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #1e3c72;
    color: #fff;
    padding: 10px 8px;
    text-align: left;
    white-space: nowrap;
  }
  td { padding: 9px 8px; border-bottom: 1px solid #eee; }
  tr:nth-child(even) td { background: #f7f9fc; }
  tr:hover td { background: #eef3fb; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    background: #e3eaf7;
    color: #1e3c72;
  }
  .empty-msg { text-align: center; color: #999; padding: 30px; }

  #loading {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    font-size: 18px;
    color: #1e3c72;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 5px solid #ddd;
    border-top-color: #2a5298;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 15px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .day { font-size: 13px; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Carregando planilhas...</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <h1>🔧 Acompanhamento de Produção</h1>
    <p>Digite seu CPF para acessar</p>
    <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
    <button onclick="fazerLogin()">Entrar</button>
    <div id="loginMsg"></div>
  </div>

  <!-- APP -->
  <div id="appArea">
    <header>
      <div class="user-info">
        <h2 id="userName">—</h2>
        <span id="userInfo">—</span>
      </div>
      <button onclick="sair()">Sair</button>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total no mês</div>
        <div class="value" id="statMes">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Dias com produção</div>
        <div class="value" id="statDias">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total geral</div>
        <div class="value" id="statTotal">0</div>
      </div>
    </div>

    <div class="calendar-card">
      <div class="cal-header">
        <h3 id="monthLabel">—</h3>
        <div class="cal-nav">
          <button onclick="mudarMes(-1)">‹</button>
          <button onclick="mudarMes(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Produção do dia</h3>
      <button class="close-btn" onclick="fecharModal()">×</button>
    </div>
    <div class="table-wrap" id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
let CPF_DATA    = [];   // [{nome, cpf, empresa, matricula}]
let PRODUCAO    = [];   // [{protocolo, cliente, tecnico, tipo, cidade, bairro, dataEncerr, reclamacao, solucao}]
let USUARIO     = null;
let MES_ATUAL   = new Date();
let MAPA_COLUNAS = {};  // guarda o mapeamento detectado

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function soDigitos(v) { return String(v ?? '').replace(/\D/g, ''); }

function normalizarNome(n) {
  return String(n ?? '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .replace(/[^A-Z0-9 ]/g, '')
    .trim();
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dia}`;
}

function parseDataExcel(v) {
  if (v === null || v === undefined || v === '') return null;
  // Serial Excel
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const s = String(v).trim();
  if (!s) return null;
  // dd/mm/yyyy ou dd-mm-yyyy (com hora opcional)
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let ano = parseInt(m[3]);
    if (ano < 100) ano += 2000;
    const d = new Date(ano, parseInt(m[2]) - 1, parseInt(m[1]));
    if (!isNaN(d)) return d;
  }
  // yyyy-mm-dd (com hora opcional)
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    const d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    if (!isNaN(d)) return d;
  }
  const d = new Date(s);
  if (!isNaN(d) && d.getFullYear() > 2000) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  return null;
}

/* ============================================================
   CARREGAMENTO
   ============================================================ */
async function carregarPlanilhas() {
  try {
    /* ---------- GESTAO.xlsx -> aba CPF ---------- */
    const respG = await fetch('GESTAO.xlsx');
    if (!respG.ok) throw new Error('Não foi possível abrir GESTAO.xlsx. Coloque o arquivo na mesma pasta do HTML.');
    const bufG = await respG.arrayBuffer();
    const wbG  = XLSX.read(bufG, { type: 'array' });

    let wsCPF = wbG.Sheets['CPF'];
    if (!wsCPF) {
      // procura por aba que contenha coluna CPF
      for (const name of wbG.SheetNames) {
        const test = XLSX.utils.sheet_to_json(wbG.Sheets[name], { header: 1, defval: '' });
        if (test.some(r => r.some(c => /cpf/i.test(String(c))))) { wsCPF = wbG.Sheets[name]; break; }
      }
    }
    if (!wsCPF) throw new Error('Aba CPF não encontrada em GESTAO.xlsx.');

    const rowsCPF = XLSX.utils.sheet_to_json(wsCPF, { header: 1, defval: '' });
    // acha linha do cabeçalho
    let hdrCPF = -1;
    for (let i = 0; i < Math.min(rowsCPF.length, 10); i++) {
      const r = rowsCPF[i].map(c => String(c).toUpperCase());
      if (r.some(c => c.includes('NOME')) && r.some(c => c.includes('CPF'))) { hdrCPF = i; break; }
    }
    if (hdrCPF < 0) hdrCPF = 1;

    const hCPF = rowsCPF[hdrCPF].map(c => String(c).toUpperCase().trim());
    const iNome = hCPF.findIndex(c => c.includes('NOME'));
    const iCpf  = hCPF.findIndex(c => c.includes('CPF'));
    const iMat  = hCPF.findIndex(c => c.includes('MATRIC'));
    const iEmp  = hCPF.findIndex(c => c.includes('EMPRESA'));

    CPF_DATA = [];
    for (let i = hdrCPF + 1; i < rowsCPF.length; i++) {
      const r = rowsCPF[i];
      const nome = String(r[iNome] ?? '').trim();
      const cpf  = soDigitos(r[iCpf]);
      if (!nome || cpf.length !== 11) continue;
      CPF_DATA.push({
        nome,
        cpf,
        matricula: iMat >= 0 ? String(r[iMat] ?? '').trim() : '',
        empresa:   iEmp >= 0 ? String(r[iEmp] ?? '').trim() : ''
      });
    }
    console.log(`✅ ${CPF_DATA.length} colaboradores carregados da GESTAO.xlsx`);

    /* ---------- encerradasgestao.xlsx -> PRODUÇÃO ---------- */
    const respP = await fetch('encerradasgestao.xlsx');
    if (!respP.ok) throw new Error('Não foi possível abrir encerradasgestao.xlsx. Coloque o arquivo na mesma pasta do HTML.');
    const bufP = await respP.arrayBuffer();
    const wbP  = XLSX.read(bufP, { type: 'array', cellDates: true });
    const wsP  = wbP.Sheets[wbP.SheetNames[0]];

    // "raw:false" mantém o texto formatado (melhor para datas como dd/mm/aaaa)
    const rowsP = XLSX.utils.sheet_to_json(wsP, { header: 1, defval: '', raw: false });
    console.log(`📄 encerradasgestao.xlsx: ${rowsP.length} linhas`);

    // 1) Detecta linha do cabeçalho (a que tiver mais palavras-chave conhecidas)
    const PALAVRAS = [
      'PROTOCOLO','CLIENTE','TECNICO','TÉCNICO','COLABORADOR','FUNCIONARIO','FUNCIONÁRIO',
      'ATIVIDADE','TIPO','SERVICO','SERVIÇO','CIDADE','MUNICIPIO','MUNICÍPIO',
      'BAIRRO','ENCERRAMENTO','DATA','RECLAMA','SOLUC','CAT_4'
    ];
    let hdrP = 0, melhorScore = -1;
    for (let i = 0; i < Math.min(rowsP.length, 15); i++) {
      const texto = rowsP[i].map(c => String(c).toUpperCase()).join(' ');
      const score = PALAVRAS.filter(p => texto.includes(p)).length;
      if (score > melhorScore) { melhorScore = score; hdrP = i; }
    }
    console.log(`📌 Cabeçalho detectado na linha ${hdrP + 1}:`, rowsP[hdrP]);

    const H = rowsP[hdrP].map(c => String(c).toUpperCase().trim());
    console.log('📋 Cabeçalhos:', H);

    // 2) Mapeia colunas por palavra-chave
    const findCol = (...chaves) => {
      for (const k of chaves) {
        const i = H.findIndex(h => h.includes(k));
        if (i >= 0) return i;
      }
      return -1;
    };

    const col = {
      protocolo: findCol('PROTOCOLO'),
      tipo:      findCol('ATIVIDADE','TIPO','SERVICO','SERVIÇO'),
      cidade:    findCol('CIDADE','MUNICIPIO','MUNICÍPIO'),
      bairro:    findCol('BAIRRO'),
      reclamacao:findCol('CAT_4','RECLAMA'),
      solucao:   findCol('SOLUC'),
      dataEnc:   findCol('ENCERRAMENTO','DATA DE ENCERR','DATA_ENCl'),
      cliente:   findCol('CLIENTE','NOME DO CLIENTE')
    };

    // 3) Detecta coluna do TÉCNICO comparando com a lista de nomes de colaboradores
    const nomesColaboradores = new Set(CPF_DATA.map(c => normalizarNome(c.nome)));
    let colTecnico = findCol('TECNICO','TÉCNICO','COLABORADOR','FUNCIONARIO','FUNCIONÁRIO');

    // Se não achou por palavra-chave, procura a coluna cujo conteúdo mais "casa" com nomes de colaboradores
    if (colTecnico < 0) {
      let melhorCol = -1, melhorAcertos = 0;
      const amostra = rowsP.slice(hdrP + 1, hdrP + 200); // amostra até 200 linhas
      for (let c = 0; c < H.length; c++) {
        let acertos = 0;
        for (const r of amostra) {
          const val = normalizarNome(r[c]);
          if (val && nomesColaboradores.has(val)) acertos++;
        }
        if (acertos > melhorAcertos) { melhorAcertos = acertos; melhorCol = c; }
      }
      if (melhorAcertos >= 3) colTecnico = melhorCol;
      console.log(`🔎 Coluna técnico detectada por conteúdo: índice ${colTecnico} (${melhorAcertos} matches)`);
    }

    // 4) Se ainda não temos data de encerramento, procura a coluna com mais datas válidas
    if (col.dataEnc < 0) {
      let melhorCol = -1, melhorCont = 0;
      const amostra = rowsP.slice(hdrP + 1, hdrP + 200);
      for (let c = 0; c < H.length; c++) {
        let cont = 0;
        for (const r of amostra) if (parseDataExcel(r[c])) cont++;
        if (cont > melhorCont) { melhorCont = cont; melhorCol = c; }
      }
      if (melhorCont > 5) col.dataEnc = melhorCol;
      console.log(`🔎 Coluna de data detectada por conteúdo: índice ${col.dataEnc} (${melhorCont} datas válidas)`);
    }

    MAPA_COLUNAS = { ...col, tecnico: colTecnico };
    console.log('🗺️ Mapeamento final:', MAPA_COLUNAS);

    if (colTecnico < 0) {
      throw new Error('Não foi possível identificar a coluna do TÉCNICO na planilha encerradasgestao.xlsx. Verifique os cabeçalhos.');
    }
    if (col.dataEnc < 0) {
      throw new Error('Não foi possível identificar a coluna de DATA DE ENCERRAMENTO na planilha encerradasgestao.xlsx.');
    }

    // 5) Monta os registros
    PRODUCAO = [];
    let semTecnico = 0, semData = 0;
    for (let i = hdrP + 1; i < rowsP.length; i++) {
      const r = rowsP[i];
      if (!r || r.length === 0) continue;
      const tecnicoRaw = String(r[colTecnico] ?? '').trim();
      if (!tecnicoRaw) { semTecnico++; continue; }

      const data = parseDataExcel(r[col.dataEnc]);
      if (!data) { semData++; continue; }

      PRODUCAO.push({
        protocolo:  col.protocolo >= 0 ? String(r[col.protocolo] ?? '').trim() : '',
        cliente:    col.cliente   >= 0 ? String(r[col.cliente]   ?? '').trim() : '',
        tecnico:    tecnicoRaw,
        tipo:       col.tipo      >= 0 ? String(r[col.tipo]      ?? '').trim() : '',
        cidade:     col.cidade    >= 0 ? String(r[col.cidade]    ?? '').trim() : '',
        bairro:     col.bairro    >= 0 ? String(r[col.bairro]    ?? '').trim() : '',
        reclamacao: col.reclamacao>= 0 ? String(r[col.reclamacao]?? '').trim() : '',
        solucao:    col.solucao   >= 0 ? String(r[col.solucao]   ?? '').trim() : '',
        dataEncerr: data
      });
    }

    console.log(`✅ ${PRODUCAO.length} produções carregadas (${semTecnico} sem técnico, ${semData} sem data)`);
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML =
      `<div style="color:#d32f2f;text-align:center;padding:20px;font-size:16px;max-width:500px;">
        ❌ Erro ao carregar planilhas<br><br>
        <b>${err.message}</b><br><br>
        <small>Verifique se <b>GESTAO.xlsx</b> e <b>encerradasgestao.xlsx</b> estão na mesma pasta deste HTML e se o navegador está rodando em um servidor local (ex.: <code>python -m http.server</code>).</small>
      </div>`;
  }
}

/* ============================================================
   LOGIN
   ============================================================ */
function fazerLogin() {
  const input = document.getElementById('cpfInput');
  const msg   = document.getElementById('loginMsg');
  const cpf   = soDigitos(input.value);

  if (cpf.length !== 11) {
    msg.textContent = 'Digite um CPF válido com 11 dígitos.';
    return;
  }
  const enc = CPF_DATA.find(c => c.cpf === cpf);
  if (!enc) {
    msg.textContent = 'CPF não encontrado na base de colaboradores.';
    return;
  }

  USUARIO = enc;
  msg.textContent = '';
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('appArea').style.display = 'block';
  document.getElementById('userName').textContent = enc.nome;
  document.getElementById('userInfo').textContent =
    `${enc.empresa || '—'}${enc.matricula ? ' • Matrícula ' + enc.matricula : ''}`;

  // Se houver produção, posiciona no mês da produção mais recente
  const lista = producoesDoUsuario();
  if (lista.length > 0) {
    const ultima = lista.reduce((a, b) => a.dataEncerr > b.dataEncerr ? a : b);
    MES_ATUAL = new Date(ultima.dataEncerr.getFullYear(), ultima.dataEncerr.getMonth(), 1);
  } else {
    MES_ATUAL = new Date();
  }

  atualizarStats();
  renderizarCalendario();
}

function sair() {
  USUARIO = null;
  document.getElementById('appArea').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('cpfInput').value = '';
  document.getElementById('loginMsg').textContent = '';
  fecharModal();
}

/* ============================================================
   PRODUÇÃO DO USUÁRIO LOGADO
   ============================================================ */
function producoesDoUsuario() {
  if (!USUARIO) return [];
  const alvo = normalizarNome(USUARIO.nome);
  // compara o nome do técnico registrado na produção
  return PRODUCAO.filter(p => normalizarNome(p.tecnico) === alvo);
}

function producaoPorDia() {
  const mapa = {};
  producoesDoUsuario().forEach(p => {
    const k = dateKey(p.dataEncerr);
    (mapa[k] ||= []).push(p);
  });
  return mapa;
}

/* ============================================================
   CALENDÁRIO
   ============================================================ */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function mudarMes(delta) {
  MES_ATUAL = new Date(MES_ATUAL.getFullYear(), MES_ATUAL.getMonth() + delta, 1);
  renderizarCalendario();
  atualizarStats();
}

function renderizarCalendario() {
  const grid  = document.getElementById('calGrid');
  const label = document.getElementById('monthLabel');
  const ano = MES_ATUAL.getFullYear();
  const mes = MES_ATUAL.getMonth();

  label.textContent = `${MESES[mes]} ${ano}`;

  const primeiroDia = new Date(ano, mes, 1);
  const diasNoMes   = new Date(ano, mes + 1, 0).getDate();
  const inicioSemana = primeiroDia.getDay();

  const porDia = producaoPorDia();
  const hojeKey = dateKey(new Date());

  let html = '';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => {
    html += `<div class="dow">${d}</div>`;
  });
  for (let i = 0; i < inicioSemana; i++) html += `<div class="day empty"></div>`;

  for (let dia = 1; dia <= diasNoMes; dia++) {
    const key = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const qtd = porDia[key]?.length || 0;
    const cls = ['day'];
    if (qtd > 0) cls.push('has-prod');
    if (key === hojeKey) cls.push('today');
    html += `<div class="${cls.join(' ')}" onclick="abrirDia('${key}')">
      <span class="num">${dia}</span>
      ${qtd > 0 ? `<span class="count">${qtd}</span>` : ''}
    </div>`;
  }

  grid.innerHTML = html;
}

function atualizarStats() {
  const lista = producoesDoUsuario();
  const ano = MES_ATUAL.getFullYear();
  const mes = MES_ATUAL.getMonth();

  const doMes = lista.filter(p =>
    p.dataEncerr.getFullYear() === ano && p.dataEncerr.getMonth() === mes);

  const diasSet = new Set(doMes.map(p => dateKey(p.dataEncerr)));

  document.getElementById('statMes').textContent   = doMes.length;
  document.getElementById('statDias').textContent  = diasSet.size;
  document.getElementById('statTotal').textContent = lista.length;
}

/* ============================================================
   MODAL
   ============================================================ */
function abrirDia(key) {
  if (!key) return;
  const lista = producaoPorDia()[key] || [];
  const [y, m, d] = key.split('-').map(Number);

  document.getElementById('modalTitle').textContent =
    `Produção de ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y} • ${lista.length} registro${lista.length !== 1 ? 's' : ''}`;

  const body = document.getElementById('modalBody');
  if (lista.length === 0) {
    body.innerHTML = `<div class="empty-msg">Nenhuma produção registrada neste dia.</div>`;
  } else {
    let html = `<table>
      <thead><tr>
        <th>Protocolo</th>
        <th>Cliente</th>
        <th>Tipo de Atividade</th>
        <th>Cidade</th>
        <th>Bairro</th>
        <th>Reclamação</th>
        <th>Solução</th>
      </tr></thead><tbody>`;
    lista.forEach(p => {
      html += `<tr>
        <td><span class="badge">${p.protocolo || '—'}</span></td>
        <td>${p.cliente || '—'}</td>
        <td>${p.tipo || '—'}</td>
        <td>${p.cidade || '—'}</td>
        <td>${p.bairro || '—'}</td>
        <td>${p.reclamacao || '—'}</td>
        <td>${p.solucao || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    body.innerHTML = html;
  }

  document.getElementById('modal').style.display = 'block';
}

function fecharModal() {
  document.getElementById('modal').style.display = 'none';
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') fecharModal();
});

document.getElementById('cpfInput').addEventListener('input', e => {
  let v = soDigitos(e.target.value).slice(0, 11);
  if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2}).*/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3}).*/,          '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3}).*/,                 '$1.$2');
  e.target.value = v;
});
document.getElementById('cpfInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

window.addEventListener('DOMContentLoaded', carregarPlanilhas);
</script>
