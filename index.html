<script>

// ---------- DADOS DE EXEMPLO: COLABORADORES ----------
const COLABORADORES_EXEMPLO = [
  { nome:'ALAN FEITOSA DE SOUTO', cpf:'646.525.643-68', supervisor:'MAILSON FRANCISCO PEREIRA', empresa:'G INFO' },
  { nome:'ANTONIO TIAGO AMANCIO DA SILVA', cpf:'111.222.333-44', supervisor:'MAILSON FRANCISCO PEREIRA', empresa:'G INFO' },
  { nome:'JOSE MARIA DA COSTA LEONARDO', cpf:'734.146.113-68', supervisor:'MAILSON FRANCISCO PEREIRA', empresa:'G INFO' },
  { nome:'MARCOS VICTOR LOPES MEDEIROS FONSECA', cpf:'034.029.363-21', supervisor:'WILLIAM ADRIANO DANTAS', empresa:'G INFO' },
  { nome:'WILLIAM ADRIANO DANTAS', cpf:'070.038.853-28', supervisor:'—', empresa:'G INFO' },
];

/* ============================================================
   ESTADO DA APLICAÇÃO
   ============================================================ */
let colaboradorAtual = null;
let modoAtual = 'prod'; // 'prod' ou 'retrab'
let mesAtual = new Date().getMonth();
let anoAtual = new Date().getFullYear();
let producao = [];
let colaboradores = [];

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function normalizarCPF(cpf) {
  return (cpf || '').replace(/\D/g, '');
}

function normalizarNome(nome) {
  return (nome || '')
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/\s+/g, ' ')
    .trim();
}

// Comparação tolerante de nomes (pequenas diferenças de digitação)
function nomesParecidos(a, b) {
  const na = normalizarNome(a);
  const nb = normalizarNome(b);
  if (na === nb) return true;
  // Se um contém o outro e a diferença de tamanho é pequena
  if (na.includes(nb) || nb.includes(na)) {
    const diff = Math.abs(na.length - nb.length);
    if (diff <= 5) return true;
  }
  // Distância de Levenshtein para pequenas diferenças
  return levenshtein(na, nb) <= 3;
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function formatarCPFInput(valor) {
  const v = valor.replace(/\D/g, '').slice(0, 11);
  if (v.length <= 3) return v;
  if (v.length <= 6) return v.replace(/(\d{3})(\d+)/, '$1.$2');
  if (v.length <= 9) return v.replace(/(\d{3})(\d{3})(\d+)/, '$1.$2.$3');
  return v.replace(/(\d{3})(\d{3})(\d{3})(\d+)/, '$1.$2.$3-$4');
}

function isTipoExcluido(tipo) {
  const t = normalizarNome(tipo);
  return TIPOS_EXCLUIDOS.some(ex => normalizarNome(ex) === t);
}

function diasNoMes(mes, ano) {
  return new Date(ano, mes + 1, 0).getDate();
}

function primeiroDiaSemana(mes, ano) {
  return new Date(ano, mes, 1).getDay();
}

function formatarData(iso) {
  if (!iso) return '';
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

/* ============================================================
   CARREGAMENTO DE DADOS
   ============================================================ */
async function carregarDados() {
  // Em produção, substitua por:
  // const prod = await fetch('producao.json').then(r => r.json());
  // const colab = await fetch('colaboradores.json').then(r => r.json());
  producao = PRODUCAO_EXEMPLO;
  colaboradores = COLABORADORES_EXEMPLO;
}

/* ============================================================
   LOGIN
   ============================================================ */
function tentarLogin() {
  const cpfDigitado = normalizarCPF(document.getElementById('cpfInput').value);
  const erroEl = document.getElementById('loginError');
  erroEl.textContent = '';

  if (cpfDigitado.length !== 11) {
    erroEl.textContent = 'CPF inválido. Digite os 11 dígitos.';
    return;
  }

  const encontrado = colaboradores.find(c => normalizarCPF(c.cpf) === cpfDigitado);
  if (!encontrado) {
    erroEl.textContent = 'CPF não encontrado na base de colaboradores.';
    return;
  }

  colaboradorAtual = encontrado;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userName').textContent = encontrado.nome;
  document.getElementById('userSupervisor').textContent = 'Supervisor: ' + (encontrado.supervisor || '—');

  mesAtual = new Date().getMonth();
  anoAtual = new Date().getFullYear();
  modoAtual = 'prod';
  atualizarToggle();
  renderizarCalendario();
}

function logout() {
  colaboradorAtual = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('cpfInput').value = '';
  document.getElementById('loginError').textContent = '';
}

/* ============================================================
   FILTRO DE REGISTROS POR MODO
   ============================================================ */
function registrosDoColaborador() {
  if (!colaboradorAtual) return [];
  const nomeColab = colaboradorAtual.nome;

  return producao.filter(reg => {
    if (modoAtual === 'prod') {
      // Produção: técnico original é o próprio colaborador E tipo não excluído
      if (!nomesParecidos(reg.tecnicoOriginal, nomeColab)) return false;
      if (isTipoExcluido(reg.tipoAtividade)) return false;
      return true;
    } else {
      // Retrabalho: técnico_original (coluna Y) é o colaborador
      // (o registro é um retrabalho onde o técnico original é o responsável)
      return nomesParecidos(reg.tecnicoOriginal, nomeColab);
    }
  });
}

/* ============================================================
   RENDERIZAÇÃO DO CALENDÁRIO
   ============================================================ */
function renderizarCalendario() {
  const grid = document.getElementById('daysGrid');
  const label = document.getElementById('monthLabel');
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  label.textContent = `${meses[mesAtual]} ${anoAtual}`;

  grid.innerHTML = '';

  const registros = registrosDoColaborador();
  // Agrupa por data de encerramento
  const porDia = {};
  registros.forEach(r => {
    const d = r.dataEncerramento;
    if (!d) return;
    if (!porDia[d]) porDia[d] = [];
    porDia[d].push(r);
  });

  const totalDias = diasNoMes(mesAtual, anoAtual);
  const offset = primeiroDiaSemana(mesAtual, anoAtual);

  // Células vazias antes do dia 1
  for (let i = 0; i < offset; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell empty';
    grid.appendChild(cell);
  }

  const hoje = new Date();
  const hojeStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;

  for (let dia = 1; dia <= totalDias; dia++) {
    const dataStr = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (dataStr === hojeStr) cell.classList.add('today');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = dia;
    cell.appendChild(num);

    const regs = porDia[dataStr] || [];
    if (regs.length > 0) {
      if (modoAtual === 'prod') cell.classList.add('has-data');
      else cell.classList.add('has-retrab');

      const badge = document.createElement('div');
      badge.className = 'badge ' + (modoAtual === 'prod' ? 'badge-prod' : 'badge-retrab');
      badge.textContent = regs.length + (regs.length === 1 ? ' item' : ' itens');
      cell.appendChild(badge);

      cell.addEventListener('click', () => abrirModal(dataStr, regs));
    }

    grid.appendChild(cell);
  }
}

/* ============================================================
   MODAL
   ============================================================ */
function abrirModal(dataStr, registros) {
  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const tbody = document.getElementById('modalTbody');

  const modoLabel = modoAtual === 'prod' ? 'Produção' : 'Retrabalhos';
  title.textContent = `${modoLabel} — ${formatarData(dataStr)} (${registros.length} item(ns))`;

  tbody.innerHTML = '';
  registros.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.protocolo || '—'}</td>
      <td>${r.cliente || '—'}</td>
      <td>${r.tipoAtividade || '—'}</td>
      <td>${r.cidade || '—'}</td>
      <td>${r.bairro || '—'}</td>
      <td>${r.cat4 || '—'}</td>
      <td>${r.solucao || '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  overlay.classList.add('open');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

/* ============================================================
   TOGGLE PRODUÇÃO / RETRABALHO
   ============================================================ */
function atualizarToggle() {
  const btnProd = document.getElementById('btnProd');
  const btnRetrab = document.getElementById('btnRetrab');
  if (modoAtual === 'prod') {
    btnProd.classList.add('active');
    btnProd.classList.remove('active-retrab');
    btnRetrab.classList.remove('active', 'active-retrab');
  } else {
    btnRetrab.classList.add('active-retrab');
    btnRetrab.classList.remove('active');
    btnProd.classList.remove('active');
  }
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  await carregarDados();

  const cpfInput = document.getElementById('cpfInput');
  cpfInput.addEventListener('input', e => {
    e.target.value = formatarCPFInput(e.target.value);
  });
  cpfInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') tentarLogin();
  });

  document.getElementById('loginBtn').addEventListener('click', tentarLogin);
  document.getElementById('logoutBtn').addEventListener('click', logout);

  document.getElementById('prevMonth').addEventListener('click', () => {
    mesAtual--;
    if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
    renderizarCalendario();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    mesAtual++;
    if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
    renderizarCalendario();
  });

  document.getElementById('btnProd').addEventListener('click', () => {
    modoAtual = 'prod';
    atualizarToggle();
    renderizarCalendario();
  });
  document.getElementById('btnRetrab').addEventListener('click', () => {
    modoAtual = 'retrab';
    atualizarToggle();
    renderizarCalendario();
  });

  document.getElementById('closeModal').addEventListener('click', fecharModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') fecharModal();
  });
});
</script>
</body>
</html>
