  .container{width:100%;max-width:1100px}
  #loginScreen{background:#fff;padding:40px 30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:420px;margin:60px auto;text-align:center}

  #loginScreen p{color:#666;margin-bottom:24px;font-size:.9rem}
  #cpfInput{width:100%;padding:14px 16px;border:2px solid #ddd;border-radius:10px;font-size:1rem;margin-bottom:16px;text-align:center;letter-spacing:1px}
  #cpfInput:focus{outline:none;border-color:#0d47a1}
  .btn{background:#0d47a1;color:#fff;border:none;padding:14px 24px;border-radius:10px;font-size:1rem;cursor:pointer;width:100%;font-weight:600}
  .btn:hover{background:#0a3a7a}
  .error{color:#d32f2f;font-size:.85rem;margin-top:10px;min-height:18px}
  #appScreen{display:none;width:100%}
  .header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 24px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .header .user-info strong{font-size:1.1rem;color:#0d47a1;display:block}
  .header .user-info span{font-size:.85rem;color:#666}
  .logout{background:transparent;border:2px solid #d32f2f;color:#d32f2f;padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:600}
  .logout:hover{background:#d32f2f;color:#fff}
  .toggle-bar{display:flex;gap:8px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;width:fit-content}
  .toggle-btn{padding:10px 28px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-weight:600;font-size:.95rem;color:#555}
  .toggle-btn.active{background:#0d47a1;color:#fff}
  .toggle-btn.active-retrab{background:#e65100;color:#fff}
  .calendar-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .calendar-header h2{font-size:1.2rem;color:#0d47a1}
  .nav-btn{background:#f0f2f5;border:none;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1.1rem;color:#0d47a1;font-weight:bold}
  .nav-btn:hover{background:#e0e4ea}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .weekdays div{text-align:center;font-weight:600;font-size:.8rem;color:#888;padding:6px 0}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day-cell{min-height:80px;border-radius:10px;padding:6px;background:#f8f9fa;border:1px solid #eee;display:flex;flex-direction:column;cursor:default;position:relative}
  .day-cell.has-data{cursor:pointer;border-color:#c8e6c9;background:#e8f5e9}
  .day-cell.has-data:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .day-cell.has-retrab{border-color:#ffe0b2;background:#fff3e0}
  .day-cell.has-retrab:hover{box-shadow:0 4px 12px rgba(230,81,0,.15)}
  .day-cell .day-num{font-weight:700;font-size:.95rem;color:#333}
  .day-cell .badge{margin-top:auto;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:20px;align-self:flex-start}
  .badge-prod{background:#0d47a1;color:#fff}
  .badge-retrab{background:#e65100;color:#fff}
  .day-cell.empty{background:transparent;border:none}
  .day-cell.today{border:2px solid #0d47a1}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:900px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal-header{padding:18px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
  .modal-header h3{font-size:1.1rem;color:#0d47a1}
  .modal-header .close-btn{background:#f0f2f5;border:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.1rem;color:#555}
  .modal-body{padding:16px 24px 24px;overflow-y:auto}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead th{background:#0d47a1;color:#fff;padding:10px 12px;text-align:left;white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid #eee;vertical-align:top}
  tbody tr:nth-child(even){background:#fafbfc}
  tbody tr:hover{background:#e3f2fd}
  @media(max-width:640px){.day-cell{min-height:60px}.header{flex-direction:column;align-items:flex-start}}
</style>
</head>

/* ============================================================
   3) UTILITÁRIOS
   ============================================================ */
const TIPOS_EXCLUIDOS = [
  'LIBERACAO DE COMBUSTIVEL EXTERNO',
  'TAREFAS ADMINISTRATIVAS TREINAMENTO GESTAO DE O.S',
  'VALIDACAO - PRESTACAO DE CONTAS'
];

function normalizarCPF(cpf){ return (cpf||'').replace(/\D/g,''); }

function normalizarNome(nome){
  return (nome||'').toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ]/g,'')
    .replace(/\s+/g,' ').trim();
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0)return n; if(n===0)return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  }
  return dp[m][n];
}

function nomesParecidos(a,b){
  const na=normalizarNome(a), nb=normalizarNome(b);
  if(!na||!nb)return false;
  if(na===nb)return true;
  if(na.includes(nb)||nb.includes(na)){
    if(Math.abs(na.length-nb.length)<=6)return true;
  }
  return levenshtein(na,nb)<=4;
}

function isTipoExcluido(tipo){
  const t=normalizarNome(tipo);
  return TIPOS_EXCLUIDOS.some(ex=>normalizarNome(ex)===t);
}

function formatarCPFInput(v){
  v=v.replace(/\D/g,'').slice(0,11);
  if(v.length<=3)return v;
  if(v.length<=6)return v.replace(/(\d{3})(\d+)/,'$1.$2');
  if(v.length<=9)return v.replace(/(\d{3})(\d{3})(\d+)/,'$1.$2.$3');
  return v.replace(/(\d{3})(\d{3})(\d{3})(\d+)/,'$1.$2.$3-$4');
}

function diasNoMes(m,a){return new Date(a,m+1,0).getDate();}
function primeiroDiaSemana(m,a){return new Date(a,m,1).getDay();}
function formatarDataBR(iso){
  if(!iso)return '';
  const p=iso.split('-');
  if(p.length!==3)return iso;
  return `${p[2]}/${p[1]}/${p[0]}`;
}

/* ============================================================
   4) ESTADO
   ============================================================ */
let colaboradorAtual=null;
let modoAtual='prod';
let mesAtual=new Date().getMonth();
let anoAtual=new Date().getFullYear();
let colaboradores=[];
let producao=[];

function carregarDados(){
  colaboradores = COLABORADORES_RAW.map(r=>({
    nome:r[0], matricula:r[1], empresa:r[2], cpf:r[3],
    supervisor: SUPERVISORES[r[0]] || '—'
  }));
  producao = PRODUCAO_RAW.map(r=>({
    protocolo: r[0],
    cliente: r[1],          // na sua planilha B é o nome do técnico; ajuste se necessário
    tipoAtividade: r[3],    // D — na sua planilha D é "RET. COM DESCONTO"; ajuste
    cidade: r[7],           // H — na sua planilha H é "INSTALAÇÃO"; ajuste
    bairro: r[8],           // I
    dataEncerramento: r[18],// data fictícia — troque pelo índice real
    cat4: r[19],            // V
    solucao: r[20],         // X
    tecnicoOriginal: r[21]  // Y
  }));
}

/* ============================================================
   5) LOGIN
   ============================================================ */
function tentarLogin(){
  const erro=document.getElementById('loginError');
  erro.textContent='';
  const cpfDigitado=normalizarCPF(document.getElementById('cpfInput').value);
  if(cpfDigitado.length!==11){erro.textContent='CPF inválido. Digite os 11 dígitos.';return;}
  const enc=colaboradores.find(c=>normalizarCPF(c.cpf)===cpfDigitado);
  if(!enc){erro.textContent='CPF não encontrado na base.';return;}
  colaboradorAtual=enc;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('userName').textContent=enc.nome;
  document.getElementById('userSupervisor').textContent='Supervisor: '+enc.supervisor;
  mesAtual=new Date().getMonth(); anoAtual=new Date().getFullYear();
  modoAtual='prod'; atualizarToggle(); renderizarCalendario();
}

function logout(){
  colaboradorAtual=null;
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='block';
  document.getElementById('cpfInput').value='';
  document.getElementById('loginError').textContent='';
}

/* ============================================================
   6) FILTRO
   ============================================================ */
function registrosDoColaborador(){
  if(!colaboradorAtual)return [];
  const nome=colaboradorAtual.nome;
  return producao.filter(reg=>{
    if(modoAtual==='prod'){
      if(isTipoExcluido(reg.tipoAtividade))return false;
      return nomesParecidos(reg.tecnicoOriginal,nome);
    }else{
      return nomesParecidos(reg.tecnicoOriginal,nome);
    }
  });
}

/* ============================================================
   7) CALENDÁRIO
   ============================================================ */
function renderizarCalendario(){
  const grid=document.getElementById('daysGrid');
  const label=document.getElementById('monthLabel');
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  label.textContent=`${meses[mesAtual]} ${anoAtual}`;
  grid.innerHTML='';

  const porDia={};
  registrosDoColaborador().forEach(r=>{
    if(!r.dataEncerramento)return;
    if(!porDia[r.dataEncerramento])porDia[r.dataEncerramento]=[];
    porDia[r.dataEncerramento].push(r);
  });

  const total=diasNoMes(mesAtual,anoAtual);
  const off=primeiroDiaSemana(mesAtual,anoAtual);
  for(let i=0;i<off;i++){
    const c=document.createElement('div');c.className='day-cell empty';grid.appendChild(c);
  }
  const hoje=new Date();
  const hojeStr=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;

  for(let d=1;d<=total;d++){
    const ds=`${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell=document.createElement('div');
    cell.className='day-cell';
    if(ds===hojeStr)cell.classList.add('today');
    const num=document.createElement('div');num.className='day-num';num.textContent=d;cell.appendChild(num);
    const regs=porDia[ds]||[];
    if(regs.length>0){
      cell.classList.add(modoAtual==='prod'?'has-data':'has-retrab');
      const b=document.createElement('div');
      b.className='badge '+(modoAtual==='prod'?'badge-prod':'badge-retrab');
      b.textContent=regs.length+(regs.length===1?' item':' itens');
      cell.appendChild(b);
      cell.addEventListener('click',()=>abrirModal(ds,regs));
    }
    grid.appendChild(cell);
  }
}

/* ============================================================
   8) MODAL
   ============================================================ */
function abrirModal(dataStr,regs){
  const overlay=document.getElementById('modalOverlay');
  const title=document.getElementById('modalTitle');
  const tbody=document.getElementById('modalTbody');
  const modoLabel=modoAtual==='prod'?'Produção':'Retrabalhos';
  title.textContent=`${modoLabel} — ${formatarDataBR(dataStr)} (${regs.length} item(ns))`;
  tbody.innerHTML='';
  regs.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${r.protocolo||'—'}</td>
      <td>${r.cliente||'—'}</td>
      <td>${r.tipoAtividade||'—'}</td>
      <td>${r.cidade||'—'}</td>
      <td>${r.bairro||'—'}</td>
      <td>${r.cat4||'—'}</td>
      <td>${r.solucao||'—'}</td>
    `;
    tbody.appendChild(tr);
  });
  overlay.classList.add('open');
}
function fecharModal(){document.getElementById('modalOverlay').classList.remove('open');}

/* ============================================================
   9) TOGGLE
   ============================================================ */
function atualizarToggle(){
  const bp=document.getElementById('btnProd');
  const br=document.getElementById('btnRetrab');
  if(modoAtual==='prod'){bp.classList.add('active');br.classList.remove('active','active-retrab');}
  else{br.classList.add('active-retrab');br.classList.remove('active');bp.classList.remove('active');}
}

/* ============================================================
   10) EVENTOS
   ============================================================ */
document.addEventListener('DOMContentLoaded',()=>{
  carregarDados();

  const inp=document.getElementById('cpfInput');
  inp.addEventListener('input',e=>{e.target.value=formatarCPFInput(e.target.value);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')tentarLogin();});

  document.getElementById('loginBtn').addEventListener('click',tentarLogin);
  document.getElementById('logoutBtn').addEventListener('click',logout);

  document.getElementById('prevMonth').addEventListener('click',()=>{
    mesAtual--;if(mesAtual<0){mesAtual=11;anoAtual--;}renderizarCalendario();
  });
  document.getElementById('nextMonth').addEventListener('click',()=>{
    mesAtual++;if(mesAtual>11){mesAtual=0;anoAtual++;}renderizarCalendario();
  });
  document.getElementById('btnProd').addEventListener('click',()=>{modoAtual='prod';atualizarToggle();renderizarCalendario();});
  document.getElementById('btnRetrab').addEventListener('click',()=>{modoAtual='retrab';atualizarToggle();renderizarCalendario();});
  document.getElementById('closeModal').addEventListener('click',fecharModal);
  document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')fecharModal();});
});
</script>
